name: Sync CPI iFlows to Repo

# ----------------------------------------------------------------------------
# Customer-agnostic CPI -> GitHub sync workflow.
#
# To onboard a new customer:
#   1. Add the four CPI_* repository secrets (see CUSTOMIZATION_GUIDE.md).
#   2. Optionally edit the cron expression below.
#   3. Optionally set repo variables (CUSTOMER_LABEL, INCLUDE_VALUE_MAPS,
#      PACKAGES_FILTER, PACKAGES_EXCLUDE) under
#      Settings -> Secrets and variables -> Actions -> Variables.
#
# No code changes required to switch customers.
# ----------------------------------------------------------------------------

on:
  schedule:
    # Daily 02:00 UTC. Edit per customer change-window if needed.
    - cron: "11 17 * * *"
  workflow_dispatch:
    inputs:
      packages_filter:
        description: "Optional comma-separated PackageIds to include (blank = all editable)"
        required: false
        default: ""
      packages_exclude:
        description: "Optional comma-separated PackageIds to exclude"
        required: false
        default: ""
      include_value_maps:
        description: "Also export Value Mappings"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      include_sap_packages:
        description: "Attempt SAP-shipped packages (usually 404)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      customer_label:
        description: "Free-text label for the run header (audit aid)"
        required: false
        default: ""

permissions:
  contents: write   # required to commit synced changes

concurrency:
  group: cpi-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Pull iFlows from CPI tenant
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # --- credentials (repository secrets) ---
      CPI_TENANT_URL:    ${{ secrets.CPI_TENANT_URL }}
      CPI_TOKEN_URL:     ${{ secrets.CPI_TOKEN_URL }}
      CPI_CLIENT_ID:     ${{ secrets.CPI_CLIENT_ID }}
      CPI_CLIENT_SECRET: ${{ secrets.CPI_CLIENT_SECRET }}

      # --- scope (dispatch inputs override repo variables override defaults) ---
      PACKAGES_FILTER: >-
        ${{ github.event.inputs.packages_filter
            || vars.PACKAGES_FILTER
            || '' }}
      PACKAGES_EXCLUDE: >-
        ${{ github.event.inputs.packages_exclude
            || vars.PACKAGES_EXCLUDE
            || '' }}
      INCLUDE_VALUE_MAPS: >-
        ${{ github.event.inputs.include_value_maps
            || vars.INCLUDE_VALUE_MAPS
            || 'false' }}
      INCLUDE_SAP_PACKAGES: >-
        ${{ github.event.inputs.include_sap_packages
            || vars.INCLUDE_SAP_PACKAGES
            || 'false' }}
      CUSTOMER_LABEL: >-
        ${{ github.event.inputs.customer_label
            || vars.CUSTOMER_LABEL
            || github.repository }}

      LOG_LEVEL: INFO

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-flight credential check
        run: |
          set -e
          missing=0
          for var in CPI_TENANT_URL CPI_TOKEN_URL CPI_CLIENT_ID CPI_CLIENT_SECRET; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing repository secret: $var"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "Add the missing secrets under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Customer label : $CUSTOMER_LABEL"
          echo "Tenant         : $CPI_TENANT_URL"
          echo "Filter         : ${PACKAGES_FILTER:-(all editable)}"
          echo "Exclude        : ${PACKAGES_EXCLUDE:-(none)}"
          echo "Include valmap : $INCLUDE_VALUE_MAPS"

      - name: Download iFlows from CPI
        run: python sync_iflows.py

      - name: Show working-tree status
        if: always()
        run: |
          echo "Working tree status (porcelain):"
          git status --short -- iflows/ || true

      - name: Commit & push changes
        if: success()
        run: |
          set -e
          git config user.name  "cpi-sync-bot"
          git config user.email "cpi-sync-bot@users.noreply.github.com"

          # Stage everything under iflows/ — this picks up new, modified,
          # and deleted files (untracked files do NOT appear in `git diff`).
          git add -A iflows/

          # Now check whether anything is actually staged. If not, bail.
          if git diff --cached --quiet -- iflows/; then
            echo "No changes detected — nothing to commit."
            exit 0
          fi

          # Show what we're about to commit (helpful in run logs).
          echo "Staged changes:"
          git diff --cached --stat -- iflows/

          MSG="chore(cpi-sync): update iFlows from ${CUSTOMER_LABEL:-tenant}"
          if [ -n "${{ github.event.inputs.customer_label }}" ]; then
            MSG="$MSG (manual run)"
          fi
          git commit -m "$MSG"
          git push origin HEAD:${{ github.ref_name }}

      - name: Job summary
        if: always()
        run: |
          {
            echo "## CPI iFlow Sync — ${CUSTOMER_LABEL:-(unlabeled)}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tenant | \`${CPI_TENANT_URL}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Filter | \`${PACKAGES_FILTER:-(all)}\` |"
            echo "| Value mappings | \`${INCLUDE_VALUE_MAPS}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
